<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Presença</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Nova Paleta de Cores */
        :root {
            --color-bg: #F5F5DC;      /* Bege */
            --color-card: #FFFFFF;
            --color-text: #000080;    /* Navy */
            --color-sim: #4682B4;     /* Steel Blue */
            --color-nao: #DC143C;     /* Crimson */
            --color-incerto: #DAA520; /* Goldenrod */
            --color-success: #1B5E20; /* Verde Floresta (Cor Nova para Botão/Balão) */
        }

        body { background-color: var(--color-bg); color: var(--color-text); }
        .card { background: var(--color-card); border-radius: 1.5rem; box-shadow: 0 4px 20px -5px rgba(0, 0, 128, 0.1); }
        
        /* Estilo do Seletor Deslizante Compacto */
        .slider-container {
            position: relative;
            display: flex;
            background: #E8E8D0;
            padding: 3px;
            border-radius: 0.75rem;
            user-select: none;
        }
        .slider-item {
            flex: 1;
            z-index: 2;
            text-align: center;
            padding: 8px 0;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--color-text);
            opacity: 0.5;
            cursor: pointer;
            transition: all 0.3s;
        }
        .slider-item.active { color: white; opacity: 1; }
        
        .slider-bg {
            position: absolute;
            top: 3px;
            left: 3px;
            height: calc(100% - 6px);
            width: calc(33.33% - 4px);
            background: var(--color-text);
            border-radius: 0.6rem;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
            z-index: 1;
        }

        /* Cores dinâmicas para o slider baseadas na paleta */
        .bg-sim { background: var(--color-sim) !important; }
        .bg-nao { background: var(--color-nao) !important; }
        .bg-incerto { background: var(--color-incerto) !important; }

        .loader { border-top-color: var(--color-text); animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Scrollbar customizada */
        #attendeesList::-webkit-scrollbar { width: 4px; }
        #attendeesList::-webkit-scrollbar-thumb { background: var(--color-sim); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen py-4 px-3">

    <div class="max-w-md mx-auto">
        <!-- Card do Formulário -->
        <div class="card p-6 mb-4 border border-[#E8E8D0]">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-[#DAA520]/20 text-[#DAA520] rounded-xl flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fas fa-calendar-day"></i>
                </div>
                <h1 id="mainTitle" class="text-xl font-black text-[#000080] tracking-tight text-center break-words leading-tight uppercase">Sincronizando...</h1>
                <p class="text-[#000080]/60 text-[10px] mt-1 text-center font-bold uppercase tracking-widest">Confirme a sua participação</p>
            </div>

            <form id="rsvpForm" class="space-y-4">
                <!-- Nome -->
                <div>
                    <input type="text" id="nome" required 
                        class="w-full px-5 py-3 rounded-xl bg-[#F5F5DC] border-2 border-transparent focus:border-[#4682B4] focus:bg-white outline-none font-bold transition-all text-[#000080] shadow-inner text-sm" 
                        placeholder="Como se chama?">
                </div>

                <!-- Slider -->
                <div>
                    <div class="slider-container" id="presenceSlider">
                        <div class="slider-bg bg-sim" id="sliderBg"></div>
                        <div class="slider-item active" onclick="updateSlider(0, 'Sim')">Sim</div>
                        <div class="slider-item" onclick="updateSlider(1, 'Não')">Não</div>
                        <div class="slider-item" onclick="updateSlider(2, 'Incerto')">Incerto</div>
                    </div>
                    <input type="hidden" id="presenca" value="Sim" required>
                </div>

                <!-- Botão Enviar (Cor Nova: Verde Floresta #1B5E20) -->
                <button type="submit" id="submitBtn" class="w-full bg-[#1B5E20] hover:bg-[#144718] text-white font-black py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 active:scale-95 disabled:opacity-50 text-sm uppercase tracking-widest">
                    <i class="fas fa-paper-plane text-xs"></i>
                    Enviar
                </button>
            </form>
        </div>

        <!-- Lista de Respondentes -->
        <div class="bg-white/80 backdrop-blur-md rounded-[1.5rem] p-5 border border-white/50 shadow-sm relative">
            
            <div class="flex items-center justify-between mb-3">
                <div class="w-6"></div> 
                <h2 class="text-[10px] font-black uppercase text-[#000080]/40 tracking-[0.3em] text-center">Respondentes</h2>
                <button onclick="fetchAttendees()" class="text-[#DAA520] hover:text-[#000080] transition-colors p-1" title="Atualizar">
                    <i id="btnUpdateIcon" class="fas fa-sync-alt text-xs"></i>
                </button>
            </div>
            
            <div id="loaderList" class="flex flex-col items-center py-4">
                <div class="loader rounded-full border-2 border-t-2 border-[#DAA520] h-5 w-5"></div>
            </div>

            <div id="attendeesList" class="max-h-80 overflow-y-auto pr-1 hidden">
                <!-- Grupos compactados via JS -->
            </div>
            
            <div id="emptyList" class="text-center py-4 hidden">
                <p class="text-[#000080]/30 text-[10px] italic font-medium uppercase">Aguardando confirmações.</p>
            </div>
        </div>
    </div>

    <!-- Notificação compacta (Cor Nova: Verde Floresta #1B5E20) -->
    <div id="msgBox" class="fixed bottom-4 left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-lg shadow-xl text-white font-bold text-xs transition-all duration-300 translate-y-20 opacity-0 z-50"></div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwHfSffXJuZ2IuoPlm_Klt2adXe0v6dtThHiytV6vOzT_VFRbP-Z6PyHzYlvgRrYjYM/exec';
        const READ_URL = 'https://docs.google.com/spreadsheets/d/1gbTGws5cW1U5pFIcjj7d5ZrWN2wT7ouEgLqe2LgEcVw/gviz/tq?tqx=out:json&gid=887050448';

        let currentOption = 'Sim';

        document.addEventListener('DOMContentLoaded', fetchAttendees);

        function updateSlider(index, val) {
            currentOption = val;
            document.getElementById('presenca').value = val;
            const items = document.querySelectorAll('.slider-item');
            const bg = document.getElementById('sliderBg');
            items.forEach((item, i) => item.classList.toggle('active', i === index));
            bg.style.transform = `translateX(${index * 100}%)`;
            bg.classList.remove('bg-sim', 'bg-nao', 'bg-incerto');
            if (val === 'Sim') bg.classList.add('bg-sim');
            else if (val === 'Não') bg.classList.add('bg-nao');
            else if (val === 'Incerto') bg.classList.add('bg-incerto');
        }

        function showMsg(text, isError = false) {
            const box = document.getElementById('msgBox');
            box.innerText = text;
            // Verde Floresta para sucesso, Crimson para erro
            box.className = `fixed bottom-4 left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-lg shadow-xl text-white font-bold text-xs transition-all duration-300 z-50 ${isError ? 'bg-[#DC143C]' : 'bg-[#1B5E20]'}`;
            box.style.opacity = "1";
            box.style.transform = "translateY(0)";
            setTimeout(() => {
                box.style.opacity = "0";
                box.style.transform = "translateY(20px)";
            }, 2500);
        }

        async function fetchAttendees() {
            const listEl = document.getElementById('attendeesList');
            const loader = document.getElementById('loaderList');
            const empty = document.getElementById('emptyList');
            const titleEl = document.getElementById('mainTitle');
            const updateIcon = document.getElementById('btnUpdateIcon');

            updateIcon.classList.add('animate-spin');
            loader.classList.remove('hidden');
            listEl.classList.add('hidden');
            empty.classList.add('hidden');

            try {
                const res = await fetch(`${READ_URL}&t=${Date.now()}`);
                const text = await res.text();
                const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonStr);
                
                if (data.table && data.table.rows && data.table.rows.length > 0) {
                    const titleVal = data.table.rows[0].c[0];
                    titleEl.innerText = (titleVal ? (titleVal.v || titleVal.f) : "") || "Evento";
                }

                const rows = data.table.rows.map(row => ({
                    nome: row.c[1] ? (row.c[1].v || row.c[1].f || "") : "",
                    resposta: row.c[2] ? (row.c[2].v || row.c[2].f || "") : ""
                })).filter(r => r.nome && r.resposta);

                if (rows.length === 0) empty.classList.remove('hidden');
                else renderGroupedList(rows);
            } catch (e) {
                console.error(e);
                titleEl.innerText = "RSVP";
                empty.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                setTimeout(() => updateIcon.classList.remove('animate-spin'), 500);
            }
        }

        function renderGroupedList(rows) {
            const listEl = document.getElementById('attendeesList');
            listEl.innerHTML = '';
            const groups = {
                'Sim': { icon: 'fa-check-circle', color: 'text-[#4682B4]', list: [] },
                'Incerto': { icon: 'fa-question-circle', color: 'text-[#DAA520]', list: [] },
                'Não': { icon: 'fa-times-circle', color: 'text-[#DC143C]', list: [] }
            };
            rows.forEach(r => { if (groups[r.resposta]) groups[r.resposta].list.push(r.nome); });

            ['Sim', 'Incerto', 'Não'].forEach(key => {
                const group = groups[key];
                if (group.list.length > 0) {
                    const section = document.createElement('div');
                    section.className = "mb-1"; 
                    section.innerHTML = `
                        <div class="flex items-center gap-1.5 mb-0.5 ml-1">
                            <i class="fas ${group.icon} ${group.color} text-[7px]"></i>
                            <span class="text-[7px] font-black uppercase tracking-widest opacity-50">${key} (${group.list.length})</span>
                        </div>
                        <div class="flex flex-col"> <!-- Espaço nulo total entre linhas -->
                            ${group.list.map(nome => `
                                <div class="bg-white/95 px-3 py-1.5 border-b border-[#000080]/5 text-[11px] font-bold text-[#000080]">
                                    ${nome}
                                </div>
                            `).join('')}
                        </div>
                    `;
                    listEl.appendChild(section);
                }
            });
            listEl.classList.remove('hidden');
        }

        document.getElementById('rsvpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const nomeInput = document.getElementById('nome');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin text-xs"></i>';
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: nomeInput.value, resposta: currentOption })
                });
                showMsg("Enviado com sucesso!");
                nomeInput.value = "";
                updateSlider(0, 'Sim');
                setTimeout(fetchAttendees, 1200);
            } catch (error) {
                showMsg("Erro ao enviar!", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane text-xs"></i> Enviar';
            }
        });
    </script>
</body>
</html>
